name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # macOS ships bash 3.2; the README recommends bash 4 or later.
      - name: Use a current bash (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install bash
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      # The suite runs against a test double of age (test/shim/age), so real age is not installed here.
      - name: Run test/run.sh
        run: |
          bash --version | head -1
          python3 --version
          test/run.sh
